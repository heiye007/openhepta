name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Architecture Check
        run: pnpm lint

      - name: Type Check (Renderer)
        run: npx tsc --noEmit

      - name: Type Check (Electron Main)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Database & FileStore Integration Tests
        run: pnpm test:db

      - name: Production Build
        run: pnpm build
